# Настройки pnpm (в pnpm 11 pnpm-специфичные опции читаются отсюда, не из .npmrc).
# Отключаем предзапусковую проверку зависимостей и supply-chain задержку
# minimumReleaseAge ТОЛЬКО для этого проекта: свежие oxlint/rolldown иначе
# блокируются глобальной политикой и валят `pnpm dev`.
verifyDepsBeforeRun: false
minimumReleaseAge: 0

# esbuild собирает нативный бинарник постустановочным скриптом. Локально он уже
# одобрен, а на чистой машине CI pnpm по умолчанию такие скрипты блокирует и падает —
# поэтому разрешаем явно.
onlyBuiltDependencies:
  - esbuild
